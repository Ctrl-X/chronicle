<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicle: The Prediction Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbar for a premium feel */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 backdrop-blur-md bg-opacity-90">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div
                    class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">
                    C</div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">Chronicle</h1>
            </div>
            <div class="text-sm text-slate-500 font-medium">The Prediction Tracker</div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- Left Column: Submission Form -->
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sticky top-24">
                <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-500" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z"
                            clip-rule="evenodd" />
                    </svg>
                    New Prediction
                </h2>
                <form id="predictionForm" class="space-y-4">
                    <div>
                        <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Your Name</label>
                        <input type="text" id="name" required
                            class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all"
                            placeholder="John Doe">
                    </div>

                    <div>
                        <label for="text" class="block text-sm font-medium text-slate-700 mb-1">Prediction</label>
                        <textarea id="text" required rows="3"
                            class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all"
                            placeholder="I predict that..."></textarea>
                    </div>

                    <div>
                        <label for="category" class="block text-sm font-medium text-slate-700 mb-1">Category</label>
                        <select id="category" required
                            class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all bg-white">
                            <option value="" disabled selected>Select a category</option>
                            <option value="Science">Science</option>
                            <option value="Technology">Technology</option>
                            <option value="Politics">Politics</option>
                            <option value="Environment">Environment</option>
                            <option value="Sports">Sports</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Finance">Finance</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="date" class="block text-sm font-medium text-slate-700 mb-1">Date</label>
                            <input type="date" id="date" required
                                class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                        </div>
                        <div>
                            <label for="location" class="block text-sm font-medium text-slate-700 mb-1">Location</label>
                            <input type="text" id="location"
                                class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all"
                                placeholder="Global">
                        </div>
                    </div>

                    <div>
                        <label for="source" class="block text-sm font-medium text-slate-700 mb-1">Source Link
                            (Optional)</label>
                        <input type="url" id="source"
                            class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all"
                            placeholder="https://...">
                    </div>

                    <button type="submit"
                        class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-lg shadow-sm hover:shadow transition-all active:scale-[0.98]">
                        Submit Prediction
                    </button>
                </form>
            </div>
        </div>

        <!-- Right Column: Timeline & Filters -->
        <div class="lg:col-span-8 space-y-6">

            <!-- Filters -->
            <div
                class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-wrap gap-3 items-center justify-between">
                <div class="flex items-center gap-2 text-slate-500 text-sm font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M3 3a1 1 0 011-1h12a1 1 0 011 1v3a1 1 0 01-.293.707L12 11.414V15a1 1 0 01-.293.707l-2 2A1 1 0 018 17v-5.586L3.293 6.707A1 1 0 013 6V3z"
                            clip-rule="evenodd" />
                    </svg>
                    Filter By:
                </div>
                <div class="flex flex-wrap gap-2 flex-1 justify-end">
                    <input type="text" id="filterName" placeholder="Name"
                        class="rounded-lg border-slate-300 border px-3 py-1.5 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                    <input type="text" id="filterLocation" placeholder="Location"
                        class="rounded-lg border-slate-300 border px-3 py-1.5 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                    <select id="filterCategory"
                        class="rounded-lg border-slate-300 border px-3 py-1.5 text-sm focus:ring-2 focus:ring-brand-500 outline-none bg-white">
                        <option value="">All Categories</option>
                        <option value="Science">Science</option>
                        <option value="Technology">Technology</option>
                        <option value="Politics">Politics</option>
                        <option value="Environment">Environment</option>
                        <option value="Sports">Sports</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Finance">Finance</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <!-- Timeline -->
            <div id="timeline" class="space-y-4">
                <!-- Loading State -->
                <div class="text-center py-12 text-slate-500 animate-pulse">
                    Loading predictions...
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Configuration Placeholders - Injected by environment or manually set
        const firebaseConfig = {
            apiKey: "AIzaSyAtiSRdjmLVboFJMBrnBPQJsLnJDBDWVhQ",
            authDomain: "vertexai-testing-453514.firebaseapp.com",
            projectId: "vertexai-testing-453514",
            storageBucket: "vertexai-testing-453514.firebasestorage.app",
            messagingSenderId: "1037500942362",
            appId: "1:1037500942362:web:b97f6815ce0f0e8d6529a3",
            measurementId: "G-Z8CFJD5QTZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Auth Handling
        const initialAuthToken = window.__initial_auth_token;
        if (initialAuthToken) {
            signInWithCustomToken(auth, initialAuthToken).catch(console.error);
        } else {
            signInAnonymously(auth).catch(console.error);
        }

        // DOM Elements
        const form = document.getElementById('predictionForm');
        const timeline = document.getElementById('timeline');
        const filterName = document.getElementById('filterName');
        const filterLocation = document.getElementById('filterLocation');
        const filterCategory = document.getElementById('filterCategory');

        // State
        let predictions = [];

        // Real-time Listener
        const q = query(collection(db, 'predictions'), orderBy('createdAt', 'desc'));

        // Note: In a real production app with heavy traffic, you might want to limit this query
        // or implement pagination. For this demo, we'll fetch all and filter client-side for instant UI.
        // Alternatively, we can build complex compound queries for server-side filtering.

        onSnapshot(q, (snapshot) => {
            predictions = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            renderTimeline();
        }, (error) => {
            console.error("Error fetching predictions:", error);
            timeline.innerHTML = `<div class="text-center py-12 text-red-500">Error loading predictions. Please check your connection or configuration.</div>`;
        });

        // Form Submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerText;
            submitBtn.disabled = true;
            submitBtn.innerText = 'Submitting...';

            try {
                const data = {
                    name: document.getElementById('name').value,
                    text: document.getElementById('text').value,
                    category: document.getElementById('category').value,
                    predictionDate: document.getElementById('date').value,
                    location: document.getElementById('location').value,
                    source: document.getElementById('source').value,
                    createdAt: serverTimestamp()
                };

                await addDoc(collection(db, 'predictions'), data);
                form.reset();
            } catch (error) {
                console.error("Error adding prediction:", error);
                alert("Failed to submit prediction. Please try again.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = originalText;
            }
        });

        // Filtering
        function renderTimeline() {
            const nameVal = filterName.value.toLowerCase();
            const locVal = filterLocation.value.toLowerCase();
            const catVal = filterCategory.value;

            const filtered = predictions.filter(p => {
                const matchName = !nameVal || (p.name && p.name.toLowerCase().includes(nameVal));
                const matchLoc = !locVal || (p.location && p.location.toLowerCase().includes(locVal));
                const matchCat = !catVal || p.category === catVal;
                return matchName && matchLoc && matchCat;
            });

            if (filtered.length === 0) {
                timeline.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-xl border border-slate-200 border-dashed">
                        <p class="text-slate-500">No predictions found matching your filters.</p>
                    </div>
                `;
                return;
            }

            timeline.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-2">
                            <div class="font-bold text-slate-900">${escapeHtml(p.name)}</div>
                            <span class="text-slate-400 text-xs">•</span>
                            <div class="text-sm text-slate-500">${escapeHtml(p.location || 'Unknown Location')}</div>
                        </div>
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-brand-50 text-brand-700 border border-brand-100">
                            ${escapeHtml(p.category)}
                        </span>
                    </div>
                    
                    <p class="text-slate-800 text-lg mb-4 leading-relaxed">
                        ${escapeHtml(p.text)}
                    </p>

                    <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                        <div class="flex items-center gap-4 text-sm text-slate-500">
                            <div class="flex items-center gap-1.5">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                Predicted for: <span class="font-medium text-slate-700">${p.predictionDate}</span>
                            </div>
                        </div>
                        
                        ${p.source ? `
                            <a href="${escapeHtml(p.source)}" target="_blank" rel="noopener noreferrer" class="text-brand-600 hover:text-brand-700 text-sm font-medium flex items-center gap-1 hover:underline">
                                Source
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z" />
                                    <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z" />
                                </svg>
                            </a>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Listen for input changes on filters
        [filterName, filterLocation, filterCategory].forEach(el => {
            el.addEventListener('input', renderTimeline);
        });

        // Utility
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>

</html>
